[project]
name = "billy-mission-control"
version = "0.1.0"
description = "Billy Mission Control: a private, read-only, phone-first cockpit (phase A4b, synthetic demo data)"
requires-python = ">=3.12"
# One runtime dependency, for passkey sign-in only (A4b): python-fido2, imported only by
# mission_control/auth/passkeys.py. requirements.txt pins it and everything it needs by hash.
dependencies = ["fido2==2.2.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, and the security rules (bandit).
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# The developer tools run fixed commands (git, ruff, unittest) without a shell.
"dev.py" = ["S603"]
"tools/*.py" = ["S603", "S607"]
# The server tests pass all-interfaces addresses on purpose, to prove they are refused. The A4a
# tests set loose permissions (S103) to prove the start-up checks refuse them, and use a fixed
# CSRF token (S106, S107) that is a test value, not a secret.
"tests/*.py" = ["S603", "S607", "S104", "S103", "S106", "S107"]
